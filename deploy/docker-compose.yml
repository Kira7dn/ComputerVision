services:
  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    container_name: camera-mediamtx
    restart: unless-stopped
    ports:
      - "18554:18554/tcp"
    volumes:
      - E:/Docker/Frigate/mediamtx-mock.yml:/mediamtx.yml:ro

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    container_name: frigate
    restart: unless-stopped
    privileged: true
    shm_size: "256mb"
    depends_on:
      - mediamtx
    gpus: all
    ports:
      - "8971:8971"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - E:/Docker/Frigate/config:/config
      - ./config.yml:/config/config.yml
      # Overlay the changed Python modules and compatibility files. The
      # prebuilt image retains its native TensorRT runtime dependencies.
      - D:/BusinessAnalyze/Camera/frigate/frigate/version.py:/opt/frigate/frigate/version.py:ro
      - D:/BusinessAnalyze/Camera/frigate/frigate/const.py:/opt/frigate/frigate/const.py:ro
      - D:/BusinessAnalyze/Camera/frigate/frigate/util/image.py:/opt/frigate/frigate/util/image.py:ro
      - D:/BusinessAnalyze/Camera/frigate/frigate/comms/event_metadata_updater.py:/opt/frigate/frigate/comms/event_metadata_updater.py:ro
      - D:/BusinessAnalyze/Camera/frigate/frigate/data_processing/real_time/face.py:/opt/frigate/frigate/data_processing/real_time/face.py:ro
      - D:/BusinessAnalyze/Camera/frigate/frigate/track/object_processing.py:/opt/frigate/frigate/track/object_processing.py:ro
      - D:/BusinessAnalyze/Camera/frigate/frigate/track/tracked_object.py:/opt/frigate/frigate/track/tracked_object.py:ro
      - E:/Docker/Frigate/media:/media/frigate
      - D:/BusinessAnalyze/Camera/models/yolov9/yolov9-t-converted.onnx:/models/yolov9-t.onnx:ro
      - /etc/localtime:/etc/localtime:ro

  frigate-notifier:
    build: ./notifier
    container_name: frigate-notifier
    restart: unless-stopped
    depends_on:
      - frigate
    env_file:
      - path: ../.env.local
        required: false
    environment:
      FRIGATE_URL: http://frigate:5000
      NOTIFIER_POLL_SECONDS: "3"
      NOTIFIER_RETRY_COUNT: "3"
      MIN_TRACK_DISPLACEMENT: "0.12"
      MIN_TRACK_DURATION_SECONDS: "2"
      ZALO_MEDIA_BASE_URL: ${NGROK_URL:-}
      VEHICLE_WHITELIST_FILE: /runtime/vehicle_whitelist.json
      NOTIFIER_STATE_FILE: /runtime/notifier_state.json
    volumes:
      - E:/Docker/Frigate/runtime:/runtime

  media-gateway:
    build: ./notifier
    container_name: camera-media-gateway
    command: ["python", "/app/media_gateway.py"]
    restart: unless-stopped
    depends_on:
      - frigate
    environment:
      FRIGATE_URL: http://frigate:5000
      MEDIA_GATEWAY_PORT: "8090"
    ports:
      - "8090:8090"
