runtime:
  image: camera-frigate:current
  build_base_image: camera-frigate:0.18.0-33c00a27e-runtime3-tensorrt
  cpu_limit: 8
  model_path: assets/models/yolov9-t-320.onnx
  media_dir: E:/Docker/Frigate/media
  rtsp_transport: tcp
mqtt:
  enabled: false

go2rtc:
  streams:
    face_camera:
      - "rtsp://{FRIGATE_DAHUA_USER}:{FRIGATE_DAHUA_PASSWORD}@192.168.100.229:554/cam/realmonitor?channel=2&subtype=1"
    car_camera:
      - "rtsp://{FRIGATE_DAHUA_USER}:{FRIGATE_DAHUA_PASSWORD}@192.168.100.229:554/cam/realmonitor?channel=1&subtype=1"
    safety_camera:
      - "rtsp://{FRIGATE_DAHUA_USER}:{FRIGATE_DAHUA_PASSWORD}@192.168.100.229:554/cam/realmonitor?channel=3&subtype=1"

logger:
  default: info

auth:
  reset_admin_password: false

notifications:
  schema_version: 2
  enabled: true
  public_base_url: "{NGROK_URL}"
  pipeline:
    finalization_timeout: 5
    shadow_mode: false
  presentation:
    locale: vi
  media:
    max_storage_mb: 2048
  channels:
    webpush:
      enabled: true
    telegram:
      enabled: true
      recipients:
        - id: security_team
          name: Security Team
          chat_id: "{TELEGRAM_CHAT_ID}"
          enabled: true
    zalo:
      enabled: true
      media_url_ttl: 300
      recipients:
        - id: operators
          name: Operators
          chat_id: "{ZALO_CHAT_ID}"
          enabled: true
  rules:
    - id: car_alert
      name: Car alert
      enabled: true
      event: alert
      filters:
        cameras:
          - car_camera
        labels:
          - car
        zones: []
        identities: []
        trigger_names: []
        conditions: []
      destinations:
        webpush: true
        telegram:
          - security_team
        zalo:
          - operators
      cooldown: 0
    - id: car_license_plate
      name: Car license plate
      enabled: false
      event: license_plate
      filters:
        cameras:
          - car_camera
        labels: []
        zones: []
        identities: []
        trigger_names: []
        conditions: []
      destinations:
        webpush: false
        telegram:
          - security_team
        zalo:
          - operators
      cooldown: 0
    - id: car_semantic_trigger
      name: Car semantic trigger
      enabled: false
      event: semantic_trigger
      filters:
        cameras:
          - car_camera
        labels: []
        zones: []
        identities: []
        trigger_names: []
        conditions: []
      destinations:
        webpush: true
        telegram:
          - security_team
        zalo:
          - operators
      cooldown: 0
    - id: car_monitoring
      name: Car monitoring
      enabled: false
      event: camera_monitoring
      filters:
        cameras:
          - car_camera
        labels: []
        zones: []
        identities: []
        trigger_names: []
        conditions: []
      destinations:
        webpush: true
        telegram:
          - security_team
        zalo:
          - operators
      cooldown: 0
    - id: face_recognition
      name: Face recognition
      enabled: true
      event: face_recognized
      filters:
        cameras:
          - face_camera
        labels:
          - person
        zones: []
        identities:
          - "*"
        trigger_names: []
        conditions: []
      destinations:
        webpush: true
        telegram:
          - security_team
        zalo:
          - operators
      cooldown: 0
    - id: smoking_alert
      name: Smoking alert
      enabled: true
      event: alert
      filters:
        cameras:
          - safety_camera
        labels:
          - smoking
        zones: []
        identities: []
        trigger_names: []
        conditions: []
      destinations:
        webpush: true
        telegram:
          - security_team
        zalo:
          - operators
      cooldown: 60
  delivery:
    max_attempts: 5
    initial_backoff: 5
    max_backoff: 300
    retention_days: 7
    max_pending: 5000
detectors:
  onnx:
    type: onnx
    device: GPU
    intra_op_num_threads: 2
    inter_op_num_threads: 1
    allow_spinning: false
    execution_mode: sequential
  onnx_2:
    type: onnx
    device: GPU
    intra_op_num_threads: 2
    inter_op_num_threads: 1
    allow_spinning: false
    execution_mode: sequential
face_recognition:
  enabled: true
  model_size: large
  device: GPU
  detection_threshold: 0.5
  min_area: 100
  unknown_score: 0.8
  recognition_threshold: 0.9
  save_attempts: 200
  blur_confidence_filter: false

lpr:
  enabled: true
  recognition_threshold: 0.9

model:
  width: 320
  height: 320
  input_tensor: nchw
  input_pixel_format: rgb
  input_dtype: float
  model_type: yolo-generic
  path: /assets/models/yolov9-t-320.onnx
  labelmap_path: /labelmap/coco-80.txt

record:
  enabled: true
  detections:
    retain:
      days: 2
  alerts:
    retain:
      days: 2

snapshots:
  enabled: true
  bounding_box: true
  retain:
    default: 2

cameras:
  face_camera: &face_camera_defaults
    enabled: true
    media_mode: external
    friendly_name: Face Recognition Camera
    face_recognition:
      enabled: true
      min_area: 750
    review:
      alerts:
        enabled: false
      detections:
        enabled: true
        labels: [person]
    objects:
      track: [person]
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/face_camera
          input_args: preset-rtsp-restream
          roles: [detect, record]
    live:
      streams:
        Main: face_camera
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    motion:
      threshold: 53
      contour_area: 10
      improve_contrast: true
  car_camera:
    <<: *face_camera_defaults
    friendly_name: Car Camera
    lpr:
      enabled: true
      min_area: 500
    detect:
      enabled: true
      width: 1820
      height: 1024
      fps: 5
    motion:
      threshold: 53
      contour_area: 10
      improve_contrast: false
    face_recognition:
      enabled: false
    review:
      alerts:
        enabled: false
      detections:
        enabled: true
        labels: [car]
    objects:
      track: [car]
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/car_camera
          input_args: preset-rtsp-restream
          roles: [detect, record]
    live:
      streams:
        Main: car_camera
  safety_camera:
    enabled: true
    media_mode: external
    friendly_name: Safety Smoking Camera
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/safety_camera
          input_args: preset-rtsp-restream
          roles: [detect, record]
    live:
      streams:
        Main: safety_camera
    detect:
      enabled: false
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    review:
      alerts:
        enabled: true
        labels: [smoking]
      detections:
        enabled: false

tracker:
  edge-local:
    managed: true
    endpoint: tracker-edge-local:50052
    cameras: [face_camera, car_camera]
    deadline: 5
    output_capacity: 256
    control_capacity: 64
    shutdown_drain: 10
    evidence:
      memory_bytes_per_camera: 33554432
      ttl: 45
    spool:
      max_bytes: 268435456
      retention: 86400
    tls:
      ca: /run/tracker-tls/ca.crt
      certificate: /run/tracker-tls/client.crt
      key: /run/tracker-tls/client.key
      server_name: tracker-edge-local
version: 0.18-0

semantic_search:
  enabled: false

classification:
  bird:
    enabled: false
