name: camera-runtime-v2

x-frigate-image: &frigate-image
  image: ${FRIGATE_IMAGE:-camera-frigate:0.18.0-33c00a27e-runtime3-reviewfix1-tensorrt}

services:
  recognition:
    image: ${RECOGNITION_IMAGE:-camera-recognition:current}
    profiles: ["external-recognition"]
    container_name: edge-recognition
    restart: unless-stopped
    shm_size: "1gb"
    gpus: all
    env_file:
      - path: ../../.env.local
        required: true
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ZALO_BOT_TOKEN: ${ZALO_BOT_TOKEN:-}
      ZALO_CHAT_ID: ${ZALO_CHAT_ID:-}
    volumes:
      - frigate-config:/config:ro
      - ${CAMERA_CONFIG_FILE:?run.ps1 must set CAMERA_CONFIG_FILE}:/config/config.yml:ro
      - ${CAMERA_MODEL_CACHE_PATH:?run.ps1 must set CAMERA_MODEL_CACHE_PATH}:/config/model_cache:ro
      - ${FRIGATE_MEDIA_DIR:-E:/Docker/Frigate/media}:/media/frigate
      - ${RECOGNITION_TLS_DIR:-../../.tmp/runtime/recognition-tls}:/run/recognition-tls:ro
      - /etc/localtime:/etc/localtime:ro

  safety:
    image: ${SAFETY_IMAGE:-camera-safety:current}
    container_name: edge-safety
    command: ["run", "--config", "/config/config.yml"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/camera-safety-health.json && grep -q '\"ready\": true' /tmp/camera-safety-health.json"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: unless-stopped
    shm_size: "512mb"
    gpus: all
    env_file:
      - path: ../../.env.local
        required: true
    environment:
      SAFETY_GRPC_URL: ${SAFETY_GRPC_URL:-frigate:50052}
    volumes:
      - frigate-config:/config
      - ${CAMERA_CONFIG_FILE:?run.ps1 must set CAMERA_CONFIG_FILE}:/config/config.yml:ro
      - ${SAFETY_MODEL_PATH:-../../assets/models/smoking/best.onnx}:/models/smoking/best.onnx:ro
      - ${CAMERA_FIXTURE_DIR:-../../assets/fixtures/mock_videos}:/mock-videos:ro
      - /etc/localtime:/etc/localtime:ro

  frigate:
    <<: *frigate-image
    container_name: frigate
    restart: unless-stopped
    shm_size: "1gb"
    mem_limit: "7g"
    cpus: ${FRIGATE_CPU_LIMIT:?run.ps1 must set runtime.cpu_limit}
    gpus: all
    env_file:
      - path: ../../.env.local
        required: true
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ZALO_BOT_TOKEN: ${ZALO_BOT_TOKEN:-}
      ZALO_CHAT_ID: ${ZALO_CHAT_ID:-}
      PASSAGE_TRACE_PATH: ${PASSAGE_TRACE_PATH:-}
      PASSAGE_EVIDENCE_DIR: ${PASSAGE_EVIDENCE_DIR:-}
      PASSAGE_EVIDENCE_MAX_BYTES: ${PASSAGE_EVIDENCE_MAX_BYTES:-134217728}
      PASSAGE_EVIDENCE_MAX_RECORDS: ${PASSAGE_EVIDENCE_MAX_RECORDS:-4096}
      PASSAGE_EVIDENCE_MIN_INTERVAL_SECONDS: ${PASSAGE_EVIDENCE_MIN_INTERVAL_SECONDS:-0.4}
      PASSAGE_CAPTURE_START_PATH: ${PASSAGE_CAPTURE_START_PATH:-}
      PASSAGE_CAPTURE_CUTOFF_PATH: ${PASSAGE_CAPTURE_CUTOFF_PATH:-}
      PASSAGE_CAPTURE_CUTOFF_DIR: ${PASSAGE_CAPTURE_CUTOFF_DIR:-}
      PASSAGE_RUN_ID: ${PASSAGE_RUN_ID:-}
      PASSAGE_SESSION_FILE: ${PASSAGE_SESSION_FILE:-}
      PASSAGE_SOURCE_START_DIR: ${PASSAGE_SOURCE_START_DIR:-}
      CAMERA_OPEN_RUNTIME_API: ${CAMERA_OPEN_RUNTIME_API:-1}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/stats >/dev/null && test -w /config && test -w /config/config.yml && test -w /media/frigate"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    ports:
      # Local-only acceptance endpoint; bypasses the auth proxy without
      # exposing Frigate's internal HTTP service to the network.
      - "127.0.0.1:5001:5000"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - frigate-config:/config
      - ${CAMERA_CONFIG_FILE:?run.ps1 must set CAMERA_CONFIG_FILE}:/config/config.yml
      - ${CAMERA_MODEL_CACHE_PATH:?run.ps1 must set CAMERA_MODEL_CACHE_PATH}:/config/model_cache
      - ${FRIGATE_MEDIA_DIR:?run.ps1 must set runtime.media_dir}:/media/frigate
      - ${CAMERA_MODEL_PATH:?run.ps1 must set runtime.model_path}:/assets/models/yolov9-t-320.onnx:ro
      - ${CAMERA_FIXTURE_DIR:-../../assets/fixtures/mock_videos}:/mock-videos:ro
      - ${RECOGNITION_TLS_DIR:-../../.tmp/runtime/recognition-tls}:/run/recognition-tls:ro
      - /etc/localtime:/etc/localtime:ro

  frontend-dev:
    image: node:22-bookworm-slim
    container_name: frontend-dev
    profiles: ["frontend-dev"]
    working_dir: /app
    environment:
      PROXY_HOST: ${CAMERA_FRONTEND_PROXY_HOST:-frigate:5001}
      LIVE_PROXY_HOST: frigate:8971
      LIVE_PROXY_PROTOCOL: ws
      MEDIA_PROXY_HOST: frigate:8971
      MEDIA_PROXY_PROTOCOL: http
    command:
      - sh
      - -lc
      - >-
        if [ ! -x node_modules/.bin/vite ] || [ ! -f node_modules/@rollup/rollup-linux-x64-gnu/package.json ]; then
        npm install --include=optional --no-audit --no-fund;
        fi;
        exec npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      frigate:
        condition: service_healthy
    ports:
      - "${CAMERA_FRONTEND_PORT:-8971}:5173"
    volumes:
      - ${CAMERA_WEB_DIR:-../../frigate/web}:/app
      - frontend-node-modules:/app/node_modules

  frontend:
    image: ${FRONTEND_IMAGE:-camera-frontend:current}
    container_name: frontend
    depends_on:
      frigate:
        condition: service_healthy
    ports:
      - "${CAMERA_FRONTEND_PORT:-8971}:5173"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: edge-ngrok
    restart: unless-stopped
    depends_on:
      frigate:
        condition: service_healthy
    command:
      - http
      - --url=${NGROK_URL:?NGROK_URL is required}
      - ${CAMERA_UI_UPSTREAM:-http://frontend:5173}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN is required}
    # Port 4040 deliberately stays inside the Compose network. The Agent API
    # has no authentication and is queried through the frigate container.

  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    container_name: edge-mediamtx
    profiles: ["replay"]
    restart: unless-stopped
    ports:
      - "18554:18554/tcp"
    volumes:
      - ./mediamtx.replay.yml:/mediamtx.yml:ro

volumes:
  frigate-config:
    name: camera-frigate-config
    external: true
  frontend-node-modules:
    name: camera-frontend-node-modules
