name: camera-runtime-v2

x-frigate-image: &frigate-image
  image: ${FRIGATE_IMAGE:-camera-frigate:0.18.0-33c00a27e-runtime3-reviewfix1-tensorrt}

services:
  frigate:
    <<: *frigate-image
    container_name: frigate
    restart: unless-stopped
    shm_size: "1gb"
    mem_limit: "7g"
    cpus: ${FRIGATE_CPU_LIMIT:-4}
    gpus: all
    env_file:
      - path: ../../.env.local
        required: true
    environment:
      FRIGATE_TELEGRAM_BOT_TOKEN: ${FRIGATE_TELEGRAM_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      FRIGATE_TELEGRAM_CHAT_ID: ${FRIGATE_TELEGRAM_CHAT_ID:-${TELEGRAM_CHAT_ID:-}}
      FRIGATE_ZALO_BOT_TOKEN: ${FRIGATE_ZALO_BOT_TOKEN:-${ZALO_BOT_TOKEN:-}}
      FRIGATE_ZALO_CHAT_ID: ${FRIGATE_ZALO_CHAT_ID:-${ZALO_CHAT_ID:-}}
      PASSAGE_TRACE_PATH: ${PASSAGE_TRACE_PATH:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/stats >/dev/null && test -w /config && test -w /config/config.yml && test -w /media/frigate"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    ports:
      - "8971:8971"
      # Local-only acceptance endpoint; bypasses the auth proxy without
      # exposing Frigate's internal HTTP service to the network.
      - "127.0.0.1:5001:5000"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - frigate-config:/config
      - ${CAMERA_CONFIG_FILE:?run.ps1 must set CAMERA_CONFIG_FILE}:/config/config.yml
      - ${FRIGATE_MEDIA_DIR:-E:/Docker/Frigate/media}:/media/frigate
      - ${CAMERA_MODEL_PATH:?run.ps1 must set CAMERA_MODEL_PATH}:/models/yolov9-t-320.onnx:ro
      - /etc/localtime:/etc/localtime:ro

  ngrok:
    image: ngrok/ngrok:latest
    container_name: camera-ngrok
    restart: unless-stopped
    depends_on:
      frigate:
        condition: service_healthy
    command:
      - http
      - --url=${NGROK_URL:?NGROK_URL is required}
      - https://frigate:8971
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN is required}
    # Port 4040 deliberately stays inside the Compose network. The Agent API
    # has no authentication and is queried through the frigate container.

  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    container_name: camera-mediamtx
    profiles: ["replay"]
    restart: unless-stopped
    ports:
      - "18554:18554/tcp"
    volumes:
      - ./mediamtx.replay.yml:/mediamtx.yml:ro

volumes:
  frigate-config:
    name: camera-frigate-config
    external: true
