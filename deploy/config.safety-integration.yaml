runtime:
  image: camera-frigate:current
  build_base_image: camera-frigate:0.18.0-33c00a27e-runtime3-tensorrt
  cpu_limit: 8
  model_path: assets/models/yolov9-t-320.onnx
  media_dir: E:/Docker/Frigate/media
  rtsp_transport: tcp
  replay:
    loop: true
    sources:
      safety_camera: assets/fixtures/mock_videos/smoker/samples/part1/bucket11.mp4

mqtt:
  enabled: false

go2rtc:
  streams:
    safety_camera:
      - rtsp://mediamtx:18554/safety_camera

logger:
  default: info

auth:
  reset_admin_password: false

notifications:
  schema_version: 2
  enabled: true
  public_base_url: "{NGROK_URL}"
  pipeline:
    finalization_timeout: 5
    shadow_mode: false
  presentation:
    locale: vi
  media:
    max_storage_mb: 2048
  channels:
    webpush:
      enabled: true
    telegram:
      enabled: true
      recipients:
        - id: security_team
          name: Security Team
          chat_id: "{TELEGRAM_CHAT_ID}"
          enabled: true
    zalo:
      enabled: true
      media_url_ttl: 300
      recipients:
        - id: operators
          name: Operators
          chat_id: "{ZALO_CHAT_ID}"
          enabled: true
  rules:
    - id: smoking_alert
      name: Smoking alert
      enabled: true
      event: alert
      filters:
        cameras: [safety_camera]
        labels: [smoking]
        zones: []
        identities: []
        trigger_names: []
        conditions: []
      destinations:
        webpush: true
        telegram: [security_team]
        zalo: [operators]
      cooldown: 60

detectors:
  onnx:
    type: onnx
    device: CPU

model:
  width: 320
  height: 320
  input_tensor: nchw
  input_pixel_format: rgb
  input_dtype: float
  model_type: yolo-generic
  path: /assets/models/yolov9-t-320.onnx
  labelmap_path: /labelmap/coco-80.txt

record:
  enabled: true
  detections:
    retain:
      days: 2
  alerts:
    retain:
      days: 2

snapshots:
  enabled: true
  bounding_box: true
  retain:
    default: 2

cameras:
  safety_camera:
    enabled: true
    friendly_name: Safety Smoking Camera
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/safety_camera
          input_args: preset-rtsp-restream
          roles: [detect, record]
    live:
      streams:
        Main: safety_camera
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    review:
      alerts:
        enabled: true
        labels: [smoking]
      detections:
        enabled: false

version: 0.18-0

semantic_search:
  enabled: false

classification:
  bird:
    enabled: false
