[project]
name = "camera-adas"
version = "0.1.0"
description = "ADAS pipeline for Dahua camera project"
requires-python = ">=3.9"
dependencies = [
    "opencv-python",
    "ultralytics",
    "numpy",
    "ffmpeg-python",
    "requests>=2.31,<3",
    "pyftpdlib==2.1.0",
    "aiohttp>=3.10,<4",
    "python-dotenv>=1.0,<2"
]

[tool.setuptools]
package-dir = {"" = "server"}

[tool.setuptools.packages.find]
where = ["server"]
include = ["camera_server*"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
