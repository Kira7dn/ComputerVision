[project]
name = "ls-vision"
version = "0.1.0"
description = "Production Camera DeepStream safety runtime"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.23.5,<2",
  "opencv-python-headless<5",
  "onnxruntime-gpu>=1.20,<2",
  "nvidia-cudnn-cu12>=9,<10",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.scripts]
ls-vision = "service:main"
ls-vision-runner = "runner:main"
ls-vision-dashboard = "interfaces.dashboard_api:main"

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.12,<0.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "apps/src"}
py-modules = ["runner", "service"]

[tool.setuptools.packages.find]
where = ["apps/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["training/vendor", "training/runs"]

[tool.ruff.lint]
ignore = ["E501"]
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
  "adapters",
  "application",
  "bootstrap",
  "domain",
  "interfaces",
]

[tool.ty.analysis]
allowed-unresolved-imports = [
  "gi",
  "gi.*",
  "pyds",
  "mediapipe",
]

[tool.ty.environment]
python-version = "3.11"
