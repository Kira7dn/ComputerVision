[project]
name = "camera-adas"
version = "0.1.0"
description = "ADAS pipeline for Dahua camera project"
requires-python = ">=3.11,<3.12"
dependencies = [
    "opencv-python>=4.11,<4.12",
    "ultralytics",
    "numpy>=1.26,<2",
    "ffmpeg-python",
    "onnxruntime-gpu>=1.20,<1.21; sys_platform == 'win32' and python_version >= '3.11'",
    "requests>=2.31,<3",
    "pyftpdlib==2.1.0",
    "aiohttp>=3.10,<4",
    "python-dotenv>=1.0,<2"
]

[tool.setuptools]
package-dir = {"" = "server"}

[tool.setuptools.packages.find]
where = ["server"]
include = ["camera_server*"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
typecheck = [
    "ty==0.0.56",
    "ruff>=0.12,<0.13",
    "pytest>=8,<9",
    "pydantic>=2.10,<3",
    "numpy>=1.26,<2",
    "opencv-contrib-python>=4.11,<4.12",
    "scipy>=1.16,<2",
    "rapidfuzz>=3.12,<4",
    "pyclipper>=1.3,<2",
    "shapely>=2,<3",
    "peewee>=3.17,<4",
    "ruamel-yaml>=0.18,<0.19",
    "sherpa-onnx>=1.12,<2",
    "types-requests",
    "websockets>=15,<16",
    "pyzmq>=26,<27",
    "regex>=2026.7,<2027",
    "pathvalidate>=3.3,<4",
    "py3nvml @ git+https://github.com/fbcotter/py3nvml",
    "unidecode>=1.3,<2",
    "titlecase>=2.4,<3",
    "paho-mqtt>=2.1,<3",
    "norfair>=2.3,<3",
    "tzlocal>=5.2,<6",
    "ws4py>=0.5,<0.6",
    "setproctitle>=1.3,<2",
    "transformers>=4.45,<4.46",
]

# Root-owned Python tooling is shared by camera-adas, validators and the
# embedded Frigate source tree.
[tool.ty.environment]
python-version = "3.11"
root = [".", "server", "frigate"]
extra-paths = ["typings"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "E711", "E712", "UP031", "UP032", "UP042", "G004"]
extend-select = ["I", "UP", "G", "ASYNC210", "B904"]

[tool.ruff.lint.per-file-ignores]
"server/camera_server/media/netsdk_source.py" = ["E402"]
"server/camera_server/tools/probe_osd.py" = ["E402"]
"server/test_real_live.py" = ["E402"]
"server/test_sdk_api.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = [".", "server", "frigate"]
testpaths = ["server/tests", "tools/tests", "frigate/frigate/test"]
