<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safety Live</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { height: 100vh; margin: 0; min-height: 100vh; overflow: hidden; background: #101418; color: #eef2f5; }
    main { display: flex; width: min(1360px, calc(100% - 32px)); height: 100vh; box-sizing: border-box; margin: 0 auto; padding: 24px 0 32px; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 22px; }
    .status { color: #ffb020; font-size: 14px; }
    .status.live { color: #39d98a; }
    .dashboard-layout { display: grid; min-height: 0; flex: 1; grid-template-columns: minmax(0, 1fr) minmax(260px, 300px); gap: 14px; align-items: stretch; }
    .dashboard-content { display: flex; min-width: 0; min-height: 0; height: 100%; flex-direction: column; }
    .cameras { display: grid; min-height: 0; flex: 1; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); align-content: start; gap: 12px; overflow-y: auto; }
    .camera { overflow: hidden; background: #0b0f12; border: 1px solid #2a333b; border-radius: 10px; }
    .camera header { padding: 12px 14px; margin: 0; border-bottom: 1px solid #2a333b; }
    .camera header > div { display: flex; align-items: center; gap: 10px; }
    .camera h2 { margin: 0; font-size: 17px; }
    .camera small { color: #9da9b2; }
    .camera-live-latency { color: #39d98a !important; font-variant-numeric: tabular-nums; }
    .frame { position: relative; overflow: hidden; aspect-ratio: 16 / 9; background: #050607; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 6px; margin-top: 10px; }
    .metric { padding: 7px 9px; background: #161d23; border: 1px solid #2a333b; border-radius: 7px; }
    .metric small { display: block; color: #9da9b2; font-size: 10px; }
    .metric strong { display: block; margin-top: 3px; font-size: 14px; }
    footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 10px; color: #9da9b2; font-size: 13px; }
    .event-panel { display: flex; min-width: 0; min-height: 0; height: 100%; flex-direction: column; background: #0b0f12; border: 1px solid #2a333b; border-radius: 10px; overflow: hidden; }
    .event-panel-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #2a333b; }
    .event-panel-header h2 { margin: 0; font-size: 15px; }
    .event-panel-header small { color: #9da9b2; }
    #eventToaster { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 8px; overflow-y: auto; padding: 8px; }
    .toast { flex: 0 0 auto; padding: 9px 10px; background: #182027; border: 1px solid #3a4650; border-left: 4px solid #64a8ff; border-radius: 8px; box-shadow: 0 8px 20px #0008; }
    .toast.new-event { animation: event-slide-down 240ms ease-out; }
    @keyframes event-slide-down {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toast.danger { border-left-color: #ff4d5e; }
    .toast.warning { border-left-color: #ffb020; }
    .toast.event { border-left-color: #64a8ff; }
    .toast-head, .toast-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .toast-head { color: #d8e1e8; font-size: 11px; }
    .toast-camera { font-weight: 700; }
    .toast-time, .toast-meta { color: #9da9b2; font-size: 11px; }
    .toast-body { display: flex; align-items: flex-start; gap: 8px; margin-top: 7px; }
    .toast-thumb { width: 92px; aspect-ratio: 16 / 9; flex: 0 0 auto; object-fit: cover; background: #050607; border-radius: 5px; }
    .toast-details { min-width: 0; }
    .toast-event { color: #fff; font-size: 13px; font-weight: 700; }
    .toast-details .toast-meta { justify-content: flex-start; margin-top: 5px; }
    .toast { cursor: pointer; }
    .toast:focus-visible { outline: 2px solid #8fc2ff; outline-offset: 2px; }
    .event-modal[hidden] { display: none; }
    .event-modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: #000b; }
    .event-modal-card { display: flex; width: min(720px, 100%); max-height: min(840px, 94vh); flex-direction: column; overflow: hidden; background: #10171d; border: 1px solid #46525d; border-radius: 12px; box-shadow: 0 20px 60px #000c; }
    .event-modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #2a333b; }
    .event-modal-header h2 { margin: 0; font-size: 17px; }
    .event-modal-close { width: 30px; height: 30px; border: 1px solid #46525d; border-radius: 6px; background: #182027; color: #eef2f5; font-size: 20px; line-height: 1; cursor: pointer; }
    .event-modal-body { overflow-y: auto; padding: 16px; }
    .event-modal-thumb { display: block; width: 100%; max-height: 430px; object-fit: contain; background: #050607; border-radius: 7px; }
    .event-modal-empty-thumb { display: grid; min-height: 120px; place-items: center; color: #9da9b2; background: #050607; border-radius: 7px; }
    .event-modal-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin: 14px 0; }
    .event-modal-fact { padding: 8px 10px; background: #182027; border: 1px solid #2a333b; border-radius: 6px; }
    .event-modal-fact small { display: block; color: #9da9b2; font-size: 10px; }
    .event-modal-fact strong { display: block; margin-top: 3px; overflow-wrap: anywhere; font-size: 13px; }
    .event-modal-json { margin: 0; padding: 10px; overflow: auto; color: #cbd5dc; background: #080b0e; border-radius: 6px; font: 11px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; }
    .stream-state { position: absolute; inset: 0; display: grid; place-items: center; color: #9da9b2; font-size: 14px; }
    video[hidden], .stream-state[hidden] { display: none; }
    @media (max-width: 900px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      main { height: auto; min-height: 100vh; }
      .dashboard-layout { height: auto; min-height: 0; flex: none; grid-template-columns: 1fr; }
      .dashboard-content { height: auto; }
      .cameras { flex: none; overflow: visible; }
      .event-panel { height: auto; }
      #eventToaster { max-height: 520px; flex: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Camera live dashboard</h1>
      <div id="status" class="status">Connecting...</div>
    </header>
    <div class="dashboard-layout">
      <div class="dashboard-content">
        <section id="cameras" class="cameras" aria-label="Camera streams"></section>
        <section class="metrics" aria-label="Runtime metrics">
          <div class="metric"><small>WSL CPU</small><strong id="hostCpu">--</strong></div>
          <div class="metric"><small>WSL RAM</small><strong id="hostRam">--</strong></div>
          <div class="metric"><small>DeepStream CPU</small><strong id="pipelineCpu">--</strong></div>
          <div class="metric"><small>DeepStream RAM (all cameras)</small><strong id="pipelineRam">--</strong></div>
          <div class="metric"><small>GPU</small><strong id="gpu">--</strong></div>
          <div class="metric"><small>WebRTC status</small><strong id="latency">--</strong></div>
        </section>
        <footer>
          <span>DeepStream outputs</span>
          <span id="stream">WebRTC: connecting</span>
        </footer>
      </div>
      <aside class="event-panel" aria-label="Danh sách sự kiện">
        <div class="event-panel-header">
          <h2>Danh sách sự kiện</h2>
          <small id="eventCount">0</small>
        </div>
        <div id="eventToaster" aria-live="polite" aria-atomic="false"></div>
      </aside>
    </div>
  </main>
  <div id="eventModal" class="event-modal" hidden role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
    <section class="event-modal-card">
      <header class="event-modal-header">
        <h2 id="eventModalTitle">Event details</h2>
        <button id="eventModalClose" class="event-modal-close" type="button" aria-label="Đóng">×</button>
      </header>
      <div id="eventModalBody" class="event-modal-body"></div>
    </section>
  </div>
  <script src="/mediamtx_reader.js"></script>
  <script>
    const status = document.getElementById('status');
    const stream = document.getElementById('stream');
    const cameras = document.getElementById('cameras');
    const eventCount = document.getElementById('eventCount');
    const players = new Map();
    let cameraSignature = '';
    let hlsLoader = null;
    const eventToaster = document.getElementById('eventToaster');
    const eventModal = document.getElementById('eventModal');
    const eventModalTitle = document.getElementById('eventModalTitle');
    const eventModalBody = document.getElementById('eventModalBody');
    const eventModalClose = document.getElementById('eventModalClose');
    const toastEntries = new Map();
    const seenEventIds = new Set();
    const maxEventRows = 10;
    let eventCursor = null;
    let eventRunId = null;
    let eventsRequestInFlight = false;
    let runtimeReady = false;
    let liveCameras = new Set();

    function setStatus(text, live) {
      status.textContent = text;
      status.classList.toggle('live', live);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }

    function formatEventTime(timestamp) {
      if (timestamp == null) return '--:--:--';
      return new Date(Number(timestamp) * 1000).toLocaleTimeString('vi-VN', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    function setVideoState(video, message, visible) {
      const frame = video.closest('.frame');
      const label = frame?.querySelector('.stream-state');
      video.hidden = !visible;
      if (label) {
        label.textContent = message;
        label.hidden = visible;
      }
    }

    function setVideoMessage(video, message, visible) {
      const frame = video.closest('.frame');
      const label = frame?.querySelector('.stream-state');
      if (label) {
        label.textContent = message;
        label.hidden = !visible;
      }
    }

    function clearToasters() {
      toastEntries.clear();
      seenEventIds.clear();
      eventToaster.replaceChildren();
      eventCount.textContent = '0';
    }

    function closeEventModal() {
      eventModal.hidden = true;
      eventModalBody.replaceChildren();
    }

    function openEventModal(event) {
      const confidence = event.confidence == null ? '--' : `${(Number(event.confidence) * 100).toFixed(2)}%`;
      const modalData = {
        event: event,
        details: event.details || {},
        start_record: event.start_record || {},
      };
      eventModalTitle.textContent = `${event.camera || 'unknown'} · ${event.event_name || 'Event'}`;
      eventModalBody.innerHTML = `
        ${(event.image_url || event.thumbnail_url)
          ? `<img class="event-modal-thumb" src="${escapeHtml(event.image_url || event.thumbnail_url)}" alt="Event thumbnail" decoding="async">`
          : '<div class="event-modal-empty-thumb">Không có thumbnail</div>'}
        <div class="event-modal-facts">
          <div class="event-modal-fact"><small>Camera</small><strong>${escapeHtml(event.camera || 'unknown')}</strong></div>
          <div class="event-modal-fact"><small>Thời gian</small><strong>${escapeHtml(formatEventTime(event.timestamp))}</strong></div>
          <div class="event-modal-fact"><small>Phân loại</small><strong>${escapeHtml(event.classification || '--')}</strong></div>
          <div class="event-modal-fact"><small>Danh tính</small><strong>${escapeHtml(event.name || '--')}</strong></div>
          <div class="event-modal-fact"><small>Độ tin cậy</small><strong>${escapeHtml(confidence)}</strong></div>
          <div class="event-modal-fact"><small>Frame bắt đầu</small><strong>${escapeHtml(event.details?.recognition_frame_number ?? event.start_record?.frame ?? '--')}</strong></div>
        </div>
        <pre class="event-modal-json">${escapeHtml(JSON.stringify(modalData, null, 2))}</pre>`;
      eventModal.hidden = false;
      eventModalClose.focus();
    }

    function eventFromToast(toast) {
      const entry = toastEntries.get(toast?.dataset.eventId || '');
      return entry?.event || null;
    }

    eventToaster.addEventListener('click', event => {
      const toast = event.target.closest('.toast');
      const item = eventFromToast(toast);
      if (item) openEventModal(item);
    });
    eventToaster.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const item = eventFromToast(event.target.closest('.toast'));
      if (!item) return;
      event.preventDefault();
      openEventModal(item);
    });
    eventModalClose.addEventListener('click', closeEventModal);
    eventModal.addEventListener('click', event => {
      if (event.target === eventModal) closeEventModal();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !eventModal.hidden) closeEventModal();
    });

    function updateOverallStatus() {
      const states = [...players.values()];
      const liveCount = states.filter(state => state.live).length;
      if (liveCount > 0) {
        setStatus(liveCount === states.length ? 'LIVE' : `LIVE (${liveCount}/${states.length})`, liveCount === states.length);
        const fallbackCount = states.filter(state => state.transport === 'hls-fallback').length;
        stream.textContent = fallbackCount
          ? `WebRTC: ${liveCount - fallbackCount}/${states.length}; HLS fallback: ${fallbackCount}`
          : `WebRTC: ${liveCount}/${states.length} camera streams`;
      } else if (states.some(state => !state.error)) {
        setStatus('Connecting...', false);
      } else {
        setStatus('Runtime offline', false);
      }
    }

    function updateBrowserLatency() {
      const states = [...players.values()].filter(state => state.live);
      const jitterValues = states
        .map(state => state.stats?.jitterBufferDelayMs)
        .filter(value => Number.isFinite(value));
      text('latency', states.length === 0
        ? runtimeReady ? 'connecting' : 'offline'
        : jitterValues.length ? `jitter ${Math.max(...jitterValues).toFixed(0)} ms` : 'connected');
    }

    function renderToast(toast, event) {
      const confidence = event.confidence == null ? '--' : `${(Number(event.confidence) * 100).toFixed(0)}%`;
      const severity = ['danger', 'warning', 'event'].includes(event.severity) ? event.severity : 'event';
      toast.className = `toast ${severity}`;
      toast.innerHTML = `
        <div class="toast-head">
          <span class="toast-camera">${escapeHtml(event.camera || 'unknown')}</span>
          <span class="toast-time">${escapeHtml(formatEventTime(event.timestamp))}</span>
        </div>
        <div class="toast-body">
          ${event.thumbnail_url ? `<img class="toast-thumb" src="${escapeHtml(event.thumbnail_url)}" alt="" loading="lazy" decoding="async">` : ''}
          <div class="toast-details">
            <div class="toast-event">${escapeHtml(event.event_name || 'Event')}</div>
            <div class="toast-meta"><span>${escapeHtml(confidence)}</span></div>
          </div>
        </div>`;
    }

    function eventTimestamp(event) {
      const timestamp = Number(event.timestamp);
      return Number.isFinite(timestamp) ? timestamp : Number.MAX_SAFE_INTEGER;
    }

    function reorderEventList() {
      [...toastEntries.values()]
        .sort((left, right) => eventTimestamp(right.event) - eventTimestamp(left.event))
        .forEach(entry => eventToaster.append(entry.toast));
    }

    function trimEventList() {
      while (toastEntries.size > maxEventRows) {
        const oldestId = toastEntries.keys().next().value;
        const oldest = toastEntries.get(oldestId);
        oldest?.toast.remove();
        toastEntries.delete(oldestId);
      }
      eventCount.textContent = String(toastEntries.size);
    }

    function enqueueEvent(event) {
      const eventId = String(event.event_id || `${event.camera}-${event.timestamp}-${event.event_name}`);
      event.event_id = eventId;
      const existing = toastEntries.get(eventId);
      if (existing) {
        existing.event = event;
        const currentThumbnail = existing.toast.querySelector('.toast-thumb')?.getAttribute('src') || '';
        if (currentThumbnail !== String(event.thumbnail_url || '')) {
          renderToast(existing.toast, event);
        }
        reorderEventList();
        return;
      }
      if (seenEventIds.has(eventId)) return;
      seenEventIds.add(eventId);
      const toast = document.createElement('article');
      toast.classList.add('new-event');
      toast.dataset.eventId = eventId;
      toast.tabIndex = 0;
      toast.setAttribute('role', 'button');
      toast.setAttribute('aria-label', `Mở chi tiết ${event.camera || 'event'}`);
      const entry = { event, toast };
      renderToast(toast, event);
      toastEntries.set(eventId, entry);
      eventToaster.append(toast);
      trimEventList();
      reorderEventList();
      eventCount.textContent = String(toastEntries.size);
    }

    function enqueueEvents(events) {
      for (const event of events) enqueueEvent(event);
    }

    async function refreshEvents() {
      if (eventsRequestInFlight) return;
      eventsRequestInFlight = true;
      try {
        const after = eventCursor === null ? 0 : eventCursor;
        const initialLimit = eventCursor === null ? `&limit=${maxEventRows * 2}` : '';
        const data = await fetch(`/api/events?after=${after}${initialLimit}`, { cache: 'no-store' }).then(response => response.json());
        if (eventCursor === null) {
          eventRunId = data.run_id;
          eventCursor = data.cursor;
          const initialEvents = [...(data.events || [])]
            .sort((left, right) => Number(left.sequence || 0) - Number(right.sequence || 0))
            .filter(event => liveCameras.size === 0 || liveCameras.has(event.camera));
          enqueueEvents(initialEvents);
          return;
        }
        if (data.run_id !== eventRunId) {
          // A new pipeline run has a new event journal. Establish its cursor
          // first so old events are not replayed as fresh notifications.
          eventRunId = data.run_id;
          eventCursor = data.cursor;
          clearToasters();
          return;
        }
        eventCursor = data.cursor;
        if (runtimeReady) {
          const events = [...(data.events || [])]
            .sort((left, right) => Number(left.sequence || 0) - Number(right.sequence || 0))
            .filter(event => liveCameras.has(event.camera));
          enqueueEvents(events);
        }
      } catch (_) {
        // Metrics failure is handled by refreshMetrics; do not show stale events.
      } finally {
        eventsRequestInFlight = false;
      }
    }

    function loadHls() {
      if (window.Hls) return Promise.resolve(window.Hls);
      if (hlsLoader) return hlsLoader;
      hlsLoader = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17';
        script.onload = () => window.Hls ? resolve(window.Hls) : reject(new Error('hls.js unavailable'));
        script.onerror = () => reject(new Error('hls.js load failed'));
        document.head.appendChild(script);
      });
      return hlsLoader;
    }

    function startHlsFallback(video, hlsUrl, state) {
      let hls = null;
      let destroyed = false;
      const attach = async () => {
        try {
          const Hls = await loadHls();
          if (destroyed) return;
          if (!Hls.isSupported()) throw new Error('HLS fallback is not supported');
          hls = new Hls({
            lowLatencyMode: true,
            liveSyncDurationCount: 1,
            liveMaxLatencyDurationCount: 3,
            maxBufferLength: 3,
            backBufferLength: 0,
            manifestLoadingMaxRetry: 2,
            levelLoadingMaxRetry: 2,
            fragLoadingMaxRetry: 2,
          });
          hls.loadSource(hlsUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {});
          });
          hls.on(Hls.Events.ERROR, (_event, data) => {
            if (data.fatal && !destroyed) {
              state.error = true;
              state.live = false;
              setVideoState(video, 'HLS fallback unavailable', false);
              updateOverallStatus();
            }
          });
        } catch (error) {
          if (destroyed) return;
          state.error = true;
          state.live = false;
          state.lastError = { type: 'hls-fallback', details: String(error), fatal: true };
          setVideoState(video, 'WebRTC unavailable; HLS fallback failed', false);
          updateOverallStatus();
        }
      };
      const onPlaying = () => {
        if (destroyed) return;
        state.live = true;
        state.error = false;
        const label = document.getElementById(`latency-${state.cameraId}`);
        if (label) label.textContent = 'HLS fallback';
        setVideoState(video, 'HLS fallback', true);
        updateBrowserLatency();
        updateOverallStatus();
      };
      video.addEventListener('playing', onPlaying);
      attach();
      return () => {
        destroyed = true;
        hls?.destroy();
        hls = null;
        video.removeEventListener('playing', onPlaying);
        video.pause();
        video.removeAttribute('src');
        video.load();
      };
    }

    function updateWebRtcStats(state) {
      if (!state.reader || !state.live || typeof state.reader.getStats !== 'function') return;
      state.reader.getStats().then(stats => {
        let inbound = null;
        stats.forEach(report => {
          if (report.type === 'inbound-rtp' && (report.kind === 'video' || report.mediaType === 'video')) {
            inbound = report;
          }
        });
        if (!inbound) return;
        const emitted = Number(inbound.jitterBufferEmittedCount);
        const delay = Number(inbound.jitterBufferDelay);
        state.stats = {
          framesDecoded: Number(inbound.framesDecoded || 0),
          packetsLost: Number(inbound.packetsLost || 0),
          jitterBufferDelayMs: emitted > 0 && Number.isFinite(delay) ? delay * 1000 / emitted : null,
        };
        const label = document.getElementById(`latency-${state.cameraId}`);
        if (label) label.textContent = 'WebRTC';
        updateBrowserLatency();
      }).catch(() => {});
    }

    function startWebRtc(video, webrtcUrl, hlsUrl, state) {
      let reader = null;
      let fallbackDestroy = null;
      let fallbackTimer = null;
      let statsTimer = null;
      let destroyed = false;

      const activateFallback = () => {
        if (destroyed || state.live || fallbackDestroy !== null) return;
        reader?.close();
        reader = null;
        state.transport = 'hls-fallback';
        state.connecting = true;
        setVideoState(video, 'WebRTC unavailable; connecting HLS fallback', false);
        fallbackDestroy = startHlsFallback(video, hlsUrl, state);
      };

      const onTrack = event => {
        if (destroyed || event.track?.kind !== 'video') return;
        if (fallbackTimer !== null) {
          window.clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
        fallbackDestroy?.();
        fallbackDestroy = null;
        state.transport = 'webrtc';
        state.connecting = false;
        state.live = true;
        state.error = false;
        const label = document.getElementById(`latency-${state.cameraId}`);
        if (label) label.textContent = 'WebRTC';
        video.srcObject = event.streams[0];
        video.play().catch(() => {});
        setVideoState(video, 'Live / WebRTC', true);
        updateBrowserLatency();
        updateOverallStatus();
      };

      const onError = error => {
        if (destroyed) return;
        state.lastError = { type: 'webrtc', details: String(error), fatal: false };
        state.connecting = true;
        state.live = false;
        state.error = false;
        setVideoState(video, 'WebRTC reconnecting...', false);
        updateOverallStatus();
      };

      try {
        if (typeof window.MediaMTXWebRTCReader !== 'function') {
          throw new Error('MediaMTXWebRTCReader unavailable');
        }
        reader = new window.MediaMTXWebRTCReader({
          url: webrtcUrl,
          user: '',
          pass: '',
          token: '',
          onError,
          onTrack,
        });
        state.reader = reader;
        statsTimer = window.setInterval(() => updateWebRtcStats(state), 1000);
        fallbackTimer = window.setTimeout(activateFallback, 10000);
      } catch (error) {
        state.lastError = { type: 'webrtc-init', details: String(error), fatal: true };
        state.error = false;
        state.connecting = true;
        setVideoState(video, 'WebRTC unavailable; connecting HLS fallback', false);
        fallbackTimer = window.setTimeout(activateFallback, 0);
      }

      state.destroy = () => {
        destroyed = true;
        if (fallbackTimer !== null) window.clearTimeout(fallbackTimer);
        if (statsTimer !== null) window.clearInterval(statsTimer);
        fallbackDestroy?.();
        fallbackDestroy = null;
        reader?.close();
        reader = null;
        state.reader = null;
        video.srcObject = null;
        video.pause();
        video.load();
      };
    }

    function renderCameras(cameraDetails) {
      // Rebuild a player when MediaMTX becomes available after dashboard startup.
      // The first metrics poll can happen before the publisher is online.
      const signature = cameraDetails
        .map(camera => `${camera.id}:${camera.webrtc_url}:${(camera.worker_ready ?? camera.ready) ? 'ready' : 'offline'}`)
        .join('|');
      if (signature === cameraSignature) return;
      cameraSignature = signature;
      // Replacing the video DOM also replaces the media element that owns the
      // WebRTC track. Destroy all existing readers before rebuilding it.
      for (const [id, player] of players) {
        player.destroy?.();
        players.delete(id);
      }
      cameras.innerHTML = cameraDetails.map(camera => {
        return `<article class="camera">
          <header><h2>${camera.id}</h2><div><small>${camera.running ? `worker ${camera.pid}` : 'worker stopped'}</small><small id="latency-${camera.id}" class="camera-live-latency">WebRTC</small></div></header>
          <div class="frame"><video id="video-${camera.id}" hidden autoplay muted playsinline></video><div class="stream-state">${camera.running ? 'Connecting...' : 'Runtime offline'}</div></div>
        </article>`;
      }).join('');
      for (const camera of cameraDetails) {
        if (players.has(camera.id)) continue;
        const video = document.getElementById(`video-${camera.id}`);
        if (!video) continue;
          const state = { cameraId: camera.id, live: false, error: false, connecting: true, destroyed: false, transport: 'webrtc', stats: null, reader: null, lastError: null };
        startWebRtc(video, camera.webrtc_url, camera.hls_url, state);
        players.set(camera.id, state);
      }
    }

    const text = (id, value) => { document.getElementById(id).textContent = value; };
    async function refreshMetrics() {
      try {
        const data = await fetch('/api/metrics', { cache: 'no-store' }).then(response => response.json());
        const memory = data.host.memory;
        text('hostCpu', data.host.cpu_percent == null ? '--' : `${data.host.cpu_percent}%`);
        text('hostRam', memory.percent == null ? '--' : `${memory.percent}% (${memory.used_mb}/${memory.total_mb} MB)`);
        text('pipelineCpu', !data.pipeline.running ? 'stopped' : data.pipeline.cpu_percent == null ? '--' : `${data.pipeline.cpu_percent}%`);
        text('pipelineRam', !data.pipeline.running ? 'stopped' : `${data.pipeline.rss_mb} MB`);
        text('gpu', !data.gpu.available ? 'unavailable' : `${data.gpu.utilization_percent}% / ${data.gpu.memory_used_mb} MB / ${data.gpu.temperature_c}°C`);
        const cameraDetails = data.pipeline.camera_details || [];
        liveCameras = new Set(cameraDetails.filter(camera => camera.running && (camera.worker_ready ?? camera.ready)).map(camera => camera.id));
        runtimeReady = Boolean(data.pipeline.running && cameraDetails.length > 0 && liveCameras.size === cameraDetails.length);
        renderCameras(cameraDetails);
        updateBrowserLatency();
        updateOverallStatus();
        if (players.size === 0) {
          stream.textContent = liveCameras.size ? `WebRTC: connecting ${liveCameras.size}/${cameraDetails.length} camera streams` : 'WebRTC: offline';
        }
        if (!runtimeReady) {
          setStatus('Runtime offline', false);
          stream.textContent = 'WebRTC: offline';
          for (const video of document.querySelectorAll('video')) {
            setVideoState(video, 'Runtime offline', false);
          }
          clearToasters();
        }
      } catch (_) {
        text('pipelineCpu', 'metrics unavailable');
        runtimeReady = false;
        liveCameras = new Set();
        setStatus('Runtime offline', false);
        stream.textContent = 'WebRTC: offline';
        for (const video of document.querySelectorAll('video')) {
          setVideoState(video, 'Runtime offline', false);
        }
        clearToasters();
      }
    }

    refreshMetrics();
    setInterval(refreshMetrics, 2000);
    refreshEvents();
    setInterval(refreshEvents, 1000);
  </script>
</body>
</html>
