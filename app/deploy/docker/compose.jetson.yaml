services:
  ls-vision:
    build:
      args:
        DEEPSTREAM_IMAGE: nvcr.io/nvidia/deepstream:7.1-triton-multiarch
        TARGET_PLATFORM: jetson
        ONNXRUNTIME_INDEX_URL: https://pypi.jetson-ai-lab.io/jp6/cu126
    image: ls-vision:deepstream-7.1-jetson
    env_file:
      - /etc/ls-vision/ls-vision.env
    environment:
      CAMERA_CONFIG: /opt/camera-safety/config/production-jetson.yaml
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    runtime: nvidia
    volumes:
      - /opt/ls-vision/models:/opt/camera-safety/models
      - /opt/ls-vision/face_library:/opt/camera-safety/face_library:ro
      - /opt/ls-vision/data/evidence:/opt/camera-safety/evidence
      - /opt/ls-vision/data/state:/opt/camera-safety/state
      - /opt/ls-vision/data/queue:/opt/camera-safety/queue
      - /opt/ls-vision/data/logs:/opt/camera-safety/logs
