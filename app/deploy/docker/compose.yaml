name: ls-vision

services:
  ls-vision:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        DEEPSTREAM_IMAGE: nvcr.io/nvidia/deepstream:7.1-gc-triton-devel@sha256:a658c53e66901295683ae4dc5afd8fec8779e2e0da1e44040e16540f49b2473e
    image: ls-vision:deepstream-7.1-gc-triton
    restart: unless-stopped
    init: true
    environment:
      CAMERA_CONFIG: /opt/camera-safety/config/production.yaml
      CAMERA_RUNTIME_ROOT: /opt/camera-safety
      CAMERA_WEB_ROOT: /opt/camera-safety/web
      CAMERA_DASHBOARD_HOST: 0.0.0.0
      CAMERA_MODELS_DIR: /opt/camera-safety/models
      CAMERA_FACE_LIBRARY_DIR: /opt/camera-safety/face_library
      CAMERA_EVIDENCE_DIR: /opt/camera-safety/evidence
      CAMERA_STATE_DIR: /opt/camera-safety/state
      CAMERA_QUEUE_DIR: /opt/camera-safety/queue
      CAMERA_LOG_DIR: /opt/camera-safety/logs
      CAMERA_STATUS_DIR: /opt/camera-safety/status
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - camera_models:/opt/camera-safety/models:ro
      - camera_face_library:/opt/camera-safety/face_library:ro
      - camera_evidence:/opt/camera-safety/evidence
      - camera_state:/opt/camera-safety/state
      - camera_queue:/opt/camera-safety/queue
      - camera_logs:/opt/camera-safety/logs
    depends_on:
      mediamtx:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: "6.0"
          memory: 12G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18080/health/live >/dev/null"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    networks: [camera_internal]

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
    healthcheck:
      # The standard MediaMTX image is scratch-based and has no shell/curl.
      # --version is the image's built-in liveness probe.
      test: ["CMD", "/mediamtx", "--version"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
    networks: [camera_internal]

volumes:
  camera_models:
  camera_face_library:
  camera_evidence:
  camera_state:
  camera_queue:
  camera_logs:

networks:
  camera_internal:
    driver: bridge
