[project]
name = "ls-vision"
version = "0.1.0"
description = "Production Camera DeepStream safety runtime"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.23.5,<2",
  "opencv-python-headless<5",
  "onnxruntime-gpu>=1.20,<2",
  "nvidia-cudnn-cu12>=9,<10",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.scripts]
ls-vision = "runner:main"
ls-vision-dashboard = "interfaces.dashboard_api:main"

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.12,<0.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]
extend-select = ["I", "UP", "B"]
