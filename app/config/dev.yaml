extends: base.yaml
profile: dev

runtime:
  wsl_distro: Ubuntu-22.04
  mediamtx_config: /mnt/d/BusinessAnalyze/Camera/app/deploy/docker/mediamtx.yml
  mediamtx_binary: /opt/camera-safety/mediamtx/mediamtx
  # Hold confirmed overlays between asynchronous inference cycles. Use wall
  # clock time because the RTSP frame rate differs between cameras.
  analysis_result_max_age_seconds: 2.0

cameras:
  - id: camera_face
    source:
      type: mock
      url: rtsp://127.0.0.1:8554/face_mock
      mock_video: /mnt/d/BusinessAnalyze/Camera/assets/fixtures/mock_videos/face-recognition/segments/01_P1E_S1_C1.mp4
      loop: true
      width: 1920
      height: 1080
      latency_ms: 200
    output:
      rtsp_url: rtsp://127.0.0.1:8554/face_bbox
    functions:
      trace: true
      face_recognition: true
      smoking_behavior: false
  - id: camera_safety
    source:
      type: mock
      url: rtsp://127.0.0.1:8554/safety_mock
      mock_video: /mnt/d/BusinessAnalyze/Camera/assets/fixtures/mock_videos/smoker/samples/part1/bucket11.mp4
      loop: true
      width: 1920
      height: 1080
      latency_ms: 200
    output:
      rtsp_url: rtsp://127.0.0.1:8554/safety_bbox
    functions:
      trace: true
      face_recognition: false
      smoking_behavior: true
      fire_smoke: true
  - id: camera_dahua
    source:
      type: rtsp
      url: rtsp://192.168.100.229:554/cam/realmonitor?channel=5&subtype=0
      username_env: FRIGATE_DAHUA_USER
      password_env: FRIGATE_DAHUA_PASSWORD
      codec: hevc
      loop: true
      width: 1920
      height: 1080
      latency_ms: 200
    output:
      rtsp_url: rtsp://127.0.0.1:8554/dahua_bbox
    functions:
      trace: true
      face_recognition: false
      smoking_behavior: true
      fire_smoke: true

smoking_behavior:
  onnx_path: /mnt/d/BusinessAnalyze/Camera/assets/models/smoking_behavior/model.onnx
  input_width: 224
  input_height: 224
  smoking_threshold: 0.60
  padding_ratio: 0.20
  interval_ms: 400
  confirmation_hits: 2
  confirmation_window: 4
  clear_hits: 4
  track_grace_frames: 30
  bbox_smoothing_alpha: 0.35
  providers:
    - CUDAExecutionProvider
    - CPUExecutionProvider
  require_gpu_provider: true

fire_smoke:
  # Exported from assets/models/fire_smoke/best.pt for the WSL runtime.
  onnx_path: /mnt/d/BusinessAnalyze/Camera/assets/models/fire_smoke/best.onnx
  input_width: 640
  input_height: 640
  fire_threshold: 0.25
  smoke_threshold: 0.20
  interval_ms: 300
  detection_hold_seconds: 1.0
  nms_iou: 0.45
  max_detections_per_label: 1
  max_bbox_area_ratio:
    fire: 0.20
    smoke: 0.70
  bbox_smoothing_alpha: 0.35
  bbox_smoothing_clear_seconds: 3.0
  confirmation_hits: 2
  confirmation_window: 4
  clear_seconds: 3.0
  trace_interval_ms: 500
  # camera_safety has a bright lamp at the far left; fire is expected near the
  # central burner while smoke may occupy a wider plume.
  class_rois:
    fire: [0.30, 0.05, 0.70, 0.80]
    smoke: [0.05, 0.00, 0.80, 0.95]
  labels:
    - fire
    - smoke
  providers:
    - CUDAExecutionProvider
    - CPUExecutionProvider
  require_gpu_provider: true

person:
  onnx_path: /mnt/d/BusinessAnalyze/Camera/assets/models/yolov9-t-320.onnx
  engine_path: /opt/camera-safety/models/person-yolov9-t320-fixed.engine
  input_width: 320
  input_height: 320
  confidence: 0.05
  iou: 0.45
  label: person
  tracking:
    bbox_smoothing_alpha: 0.30
    confirmation_hits: 2
    confirmation_window: 4
    fire_smoke_exclusion_overlap_ratio: 0.25

recognition:
  enabled: true
  stream_epoch: deepstream-safety
  face:
    unknown_score: 0.8
    recognition_threshold: 0.8
    min_faces: 2
    identity_switch_similarity: 0.65
    max_attempts: 24
    max_attempts_after_recognition: 6
    area_cap: 4000
  face_runtime:
    detector_model: /mnt/d/BusinessAnalyze/Camera/assets/models/face/facedet.onnx
    recognizer_model: /mnt/d/BusinessAnalyze/Camera/assets/models/face/arcface.onnx
    library_directory: /mnt/d/BusinessAnalyze/Camera/.tmp/camera-safety-face-library/face_library
    detection_threshold: 0.5
    min_area: 1200
    recognition_interval_ms: 400
    providers:
      - CUDAExecutionProvider
      - CPUExecutionProvider
    require_gpu_provider: true
  lpr:
    detect_fps: 5
    recognition_threshold: 0.9
    cluster_threshold: 0.85
    min_plate_length: 0
    plate_format: null

metadata:
  zmq_pub_url: tcp://127.0.0.1:5555

# Notification contract copied from the Frigate provider adapters, but owned
# by the standalone DeepStream worker. Credentials and recipient chat IDs stay
# in .env.local.
notifications:
  enabled: true
  public_base_url_env: NGROK_URL
  cooldown_seconds: 30
  queue_size: 256
  retry:
    max_attempts: 3
    initial_backoff_seconds: 2
    max_backoff_seconds: 60
  # Severity is resolved before notification rules are matched.
  severity:
    default: low
    rules:
      - severity: critical
        functions: [fire_smoke]
        classifications: [fire]
      - severity: high
        functions: [fire_smoke]
        classifications: [smoke]
      - severity: high
        functions: [smoking_behavior]
  channels:
    telegram:
      enabled: true
      token_env: TELEGRAM_BOT_TOKEN
      recipients:
        - id: operations
          chat_id_env: TELEGRAM_CHAT_ID
    zalo:
      enabled: true
      token_env: ZALO_BOT_TOKEN
      recipients:
        - id: operations
          chat_id_env: ZALO_CHAT_ID
  rules:
    - id: critical-safety-alerts
      enabled: true
      severities: [critical]
      functions: [fire_smoke]
      cameras: []
      destinations:
        telegram: [operations]
        zalo: [operations]
    - id: high-safety-alerts
      enabled: true
      severities: [high]
      functions: [smoking_behavior, fire_smoke]
      cameras: []
      destinations:
        telegram: [operations]
        zalo: [operations]

evidence:
  directory: /mnt/d/BusinessAnalyze/Camera/.tmp/deepstream-safety
  prefix: snapshots-acceptance
  snapshot_interval_ms: 1000
  max_snapshots_per_event: 3
  peak_score_delta: 0.05

snapshots:
  enabled: true
  min_interval_ms: 1000

events:
  enabled: true
  camera: safety_mock
  # smoking_behavior already confirms two ROI scores in a four-attempt window.
  confirm_seconds: 0.0
  clear_seconds: 5.0
  trace_interval_ms: 400
