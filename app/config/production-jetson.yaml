extends: production.yaml
profile: production

runtime:
  status_directory: /opt/camera-safety/status
  state_directory: /opt/camera-safety/state
  allow_engine_build: true

notifications:
  enabled: false

cameras:
  - id: camera_dahua
    source:
      type: rtsp
      url: rtsp://192.168.1.229:554/cam/realmonitor?channel=5&subtype=0
      username_env: CAMERA_DAHUA_USER
      password_env: CAMERA_DAHUA_PASSWORD
      codec: hevc
      decoder: software
      loop: true
      width: 1920
      height: 1080
      latency_ms: 200
    output:
      rtsp_url: rtsp://mediamtx:8554/dahua_bbox
    functions:
      trace: true
      face_recognition: false
      smoking_behavior: true
      fire_smoke: true
    analysis:
      functions:
        fire_smoke:
          interval_ms: 300
          thresholds: {fire: 0.30, smoke: 0.40}
          rois: {}
        smoking:
          interval_ms: 400
          threshold: 0.60
          crop: {strategy: person_padded, padding_ratio: 0.20}
          confirmation: {hits: 2, attempts: 4, clear_hits: 4}

person:
  # DeepStream serializes an ONNX-generated engine beside the ONNX source on
  # this Jetson image; the Jetson models mount is writable for this cache.
  engine_path: /opt/camera-safety/models/yolov9-t-320.onnx_b1_gpu0_fp16.engine
