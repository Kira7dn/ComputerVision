profile: base

runtime:
  analysis_result_max_age_seconds: 2.0
  status_directory: /opt/camera-safety/status
  state_directory: /opt/camera-safety/state

analysis:
  result_max_age_ms: 1000
  functions: {}

front_assistance:
  enabled: false
  mode: vision_only
  model_path: /opt/ls-vision/models/openpilot/driving_supercombo.onnx
  model_rate_hz: 20
  max_gap_seconds: 0.25
  providers: [TensorrtExecutionProvider, CUDAExecutionProvider]
  allow_cpu: false
  rollout: shadow

smoking_behavior:
  object_detection:
    enabled: true
    warmup: true
    input_width: 640
    input_height: 640
    confidence: 0.35
    nms_iou: 0.50
    person_match_iou: 0.10
  temporal:
    confirmation_hits: 2
    confirmation_window: 4
    minimum_duration_seconds: 0.4
    clear_negative_observations: 4
  lifecycle:
    candidate_timeout_seconds: 3.0
    clearing_seconds: 3.0
    notification_min_duration_seconds: 3.0
    trace_interval_ms: 400

dms:
  face_mesh:
    ear_threshold: 0.20
    mar_threshold: 0.65
    yaw_threshold_deg: 16.0
    pitch_threshold_deg: 14.0
    neutral_calibration:
      enabled: true
      minimum_samples: 15
      window_size: 30
      max_yaw_std_deg: 8.0
      max_pitch_std_deg: 5.0
      neutral_update_alpha: 0.01
      neutral_update_max_delta_deg: 5.0
  event_policy:
    model:
      min_score: 0.50
      require_person_match: true
      confirmation_hits: 6
      confirmation_window: 10
      minimum_duration_seconds: 1.0
      candidate_timeout_seconds: 3.0
      clear_seconds: 2.0
      unknown_timeout_seconds: 1.5
      trace_interval_ms: 1000
    face:
      confirmation_hits: 5
      confirmation_window: 8
      minimum_duration_seconds: 0.8
      candidate_timeout_seconds: 2.0
      clear_seconds: 1.0
      unknown_timeout_seconds: 0.8
      trace_interval_ms: 800
    no_seatbelt:
      confirmation_hits: 12
      confirmation_window: 15
      minimum_duration_seconds: 2.5
      candidate_timeout_seconds: 4.0
      clear_seconds: 2.0
      unknown_timeout_seconds: 1.5
      trace_interval_ms: 1000

fire_smoke:
  tracking:
    match_iou: 0.10
    match_center_distance: 0.20
    min_area_ratio: 0.25
    max_area_ratio: 4.0
    bbox_smoothing_alpha: 0.35
    confirmation_hits: 4
    confirmation_window: 6
    minimum_duration_seconds: 1.5
    notification_min_duration_seconds: 3.0
    clear_seconds: 3.0
  dynamics:
    mode: advisory
    crop_padding_ratio: 0.10
    crop_size: 96
    changed_pixel_delta: 15
    changed_pixel_ratio: 0.06
    edge_change_ratio: 0.04
    flow_q75: 0.5
    flow_circular_variance: 0.25
    required_conditions: 2
    confirmation_votes: 3
    confirmation_window: 5
    context_padding_ratio: 0.30
    canny_low: 50
    canny_high: 150

evidence:
  directory: /opt/camera-safety/evidence
  prefix: snapshots-acceptance

snapshots:
  enabled: true

notifications:
  enabled: false
