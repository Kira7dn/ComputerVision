extends: dev.yaml
profile: production

runtime:
  status_directory: /opt/camera-safety/status
  state_directory: /opt/camera-safety/state

evidence:
  directory: /opt/camera-safety/evidence

cameras:
  - id: camera_face
    source:
      type: rtsp
      url: rtsp://camera-face:554/stream
      username_env: CAMERA_FACE_USER
      password_env: CAMERA_FACE_PASSWORD
    output:
      rtsp_url: rtsp://mediamtx:8554/face_bbox
    functions:
      trace: true
      face_recognition: true
      smoking_behavior: false
      fire_smoke: false
  - id: camera_safety
    source:
      type: rtsp
      url: rtsp://camera-safety:554/stream
      username_env: CAMERA_SAFETY_USER
      password_env: CAMERA_SAFETY_PASSWORD
    output:
      rtsp_url: rtsp://mediamtx:8554/safety_bbox
    functions:
      trace: true
      face_recognition: false
      smoking_behavior: true
      fire_smoke: true
    analysis:
      functions:
        fire_smoke:
          interval_ms: 300
          thresholds: {fire: 0.30, smoke: 0.40}
          rois:
            fire: [0.30, 0.05, 0.70, 0.80]
            smoke: [0.05, 0.00, 0.80, 0.95]
        smoking:
          interval_ms: 400
          threshold: 0.60
          crop: {strategy: person_padded, padding_ratio: 0.20}
          confirmation: {hits: 2, attempts: 4, clear_hits: 4}
  - id: DMS
    source:
      type: rtsp
      url: rtsp://camera-dahua:554/stream
      username_env: CAMERA_DAHUA_USER
      password_env: CAMERA_DAHUA_PASSWORD
    output:
      rtsp_url: rtsp://mediamtx:8554/dahua_bbox
    functions:
      trace: false
      face_recognition: false
      dms: true
      smoking_behavior: false
      fire_smoke: false
    analysis:
      functions:
        fire_smoke:
          interval_ms: 300
          thresholds: {fire: 0.30, smoke: 0.40}
          rois: {}
        smoking:
          interval_ms: 400
          threshold: 0.60
          crop: {strategy: person_padded, padding_ratio: 0.20}
          confirmation: {hits: 2, attempts: 4, clear_hits: 4}

person:
  onnx_path: /opt/camera-safety/models/yolov9-t-320.onnx
  engine_path: /opt/camera-safety/models/person-yolov9-t320-fixed.engine

smoking_behavior:
  onnx_path: /opt/camera-safety/models/smoking_behavior/model.onnx
  object_detection:
    models:
      chaitanya:
        onnx_path: /opt/camera-safety/models/smoking_behavior/tbox/chaitanya_best.onnx
      soham:
        onnx_path: /opt/camera-safety/models/smoking_behavior/tbox/soham_best.onnx

dms:
  object_detection:
    enabled: true
    input_width: 640
    input_height: 640
    confidence: 0.35
    nms_iou: 0.50
    person_match_iou: 0.10
    models:
      chaitanya:
        onnx_path: /opt/camera-safety/models/smoking_behavior/tbox/chaitanya_best.onnx
        labels: [Cigarette, Drinking, Eating, Phone, Seatbelt]
        positive_labels: [Cigarette, Drinking, Eating, Phone, Seatbelt]
      soham:
        onnx_path: /opt/camera-safety/models/smoking_behavior/tbox/soham_best.onnx
        labels: [Distracted, Drinking, Drowsy, Eating, PhoneUse, SafeDriving, Seatbelt, Smoking]
        positive_labels: [Distracted, Drinking, Drowsy, Eating, PhoneUse, SafeDriving, Seatbelt, Smoking]
  face_mesh:
    enabled: true
  alerts:
    on_frames: 3
    off_frames: 2
  interval_ms: 200

fire_smoke:
  onnx_path: /opt/camera-safety/models/fire_smoke/best.onnx
  # Advisory telemetry remains enabled for hard-negative mining.
  dynamics:
    mode: advisory

recognition:
  face_runtime:
    detector_model: /opt/camera-safety/models/face/facedet.onnx
    recognizer_model: /opt/camera-safety/models/face/arcface.onnx
    library_directory: /opt/camera-safety/face_library

notifications:
  enabled: true
